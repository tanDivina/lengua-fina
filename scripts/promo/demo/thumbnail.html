<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- YouTube thumbnail, 1280x720. Render (from this folder):
     Chrome --headless=new --screenshot=OUT.png --window-size=1280,720 --virtual-time-budget=6000 "file://$PWD/thumbnail.html?mascot=file://.../public/mascot/tamandua.svg"
     The verdict text is the real saved Oct 25 Brussels flag; the badge is the measured validate result. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { position: relative; background: radial-gradient(circle at 24% 52%, #2a2410 0%, #0f0f10 62%); font-family: Inter, sans-serif; color: #f5f5f2; }
  .mascot { position: absolute; left: -10px; top: 90px; height: 580px; filter: drop-shadow(0 24px 40px rgba(0,0,0,.55)); }
  .mascot svg { height: 580px; width: auto; }
  .copy { position: absolute; left: 520px; top: 56px; width: 720px; }
  .kicker { white-space: nowrap; font: 700 22px Inter, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #ffd24a; }
  h1 { font: 800 96px/0.95 'Bricolage Grotesque', sans-serif; letter-spacing: -.03em; margin-top: 14px; }
  h1 .a { color: #95a2ff; } h1 .b { color: #ff7a45; } h1 .c { color: #ffd24a; }
  .note { position: absolute; left: 520px; top: 420px; width: 710px; padding: 20px 24px; border-radius: 24px; background: #ff7a45; color: #141414;
          box-shadow: 0 24px 50px rgba(0,0,0,.5); }
  .note .row { display: flex; justify-content: space-between; font: 700 20px Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  .note .drop { margin-top: 10px; font: 700 26px Inter, sans-serif; }
  .note .drop s { text-decoration-thickness: 3px; }
  .note p { font-size: 24px; line-height: 1.3; margin-top: 6px; color: #2e2a27; }
  .badge { position: absolute; left: 520px; top: 628px; display: flex; gap: 14px; }
  .badge span { white-space: nowrap; padding: 10px 18px; border-radius: 14px; font: 700 24px Inter, sans-serif; }
  .b1 { background: #ffd24a; color: #141414; }
  .b2 { background: rgba(245,245,242,.1); color: #f5f5f2; border: 2px solid rgba(245,245,242,.25); }
</style>
</head>
<body>
  <div class="mascot" id="mascot"></div>
  <div class="copy">
    <div class="kicker">Transcreation agent · Qloo taste data</div>
    <h1>Your copy, read by <span class="a">three</span> <span class="b">different</span> <span class="c">rooms</span></h1>
  </div>
  <div class="note">
    <div class="row"><span>Brussels · French</span><span>Saved run</span></div>
    <div class="drop">Dropped: <s>Smooth as a Brussels praline</s></div>
    <p>Comparing the bar to the city's own praline invites a contest with local chocolate.</p>
  </div>
  <div class="badge"><span class="b1">0–5% artist overlap</span><span class="b2">Tokyo · Brussels · Austin</span></div>
<script>
  fetch(new URLSearchParams(location.search).get('mascot')).then((r) => r.text()).then((svg) => { document.getElementById('mascot').innerHTML = svg; });
</script>
</body>
</html>
